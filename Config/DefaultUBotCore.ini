; Saved Blueprint math calls migrate to the protocol-independent functions in Core.
; These are asset redirects only: the old C++ symbols and reflected functions were removed in 0.2.0.
; ROS-specific functions are redirected by UBotROS when that plugin is enabled.

[CoreRedirects]
+FunctionRedirects=(OldName="/Script/UBotCore.UBotConventionsLibrary.PositionUEToROS",NewName="/Script/UBotCore.UBotConventionsLibrary.PositionUEToRightHanded")
+FunctionRedirects=(OldName="/Script/UBotCore.UBotConventionsLibrary.PositionROSToUE",NewName="/Script/UBotCore.UBotConventionsLibrary.PositionRightHandedToUE")
+FunctionRedirects=(OldName="/Script/UBotCore.UBotConventionsLibrary.VectorUEToROS",NewName="/Script/UBotCore.UBotConventionsLibrary.VectorUEToRightHanded")
+FunctionRedirects=(OldName="/Script/UBotCore.UBotConventionsLibrary.VectorROSToUE",NewName="/Script/UBotCore.UBotConventionsLibrary.VectorRightHandedToUE")
+FunctionRedirects=(OldName="/Script/UBotCore.UBotConventionsLibrary.AngularVelocityUEToROS",NewName="/Script/UBotCore.UBotConventionsLibrary.AngularVelocityUEToRightHanded")
+FunctionRedirects=(OldName="/Script/UBotCore.UBotConventionsLibrary.AngularVelocityROSToUE",NewName="/Script/UBotCore.UBotConventionsLibrary.AngularVelocityRightHandedToUE")
+FunctionRedirects=(OldName="/Script/UBotCore.UBotConventionsLibrary.RotationUEToROS",NewName="/Script/UBotCore.UBotConventionsLibrary.RotationUEToRightHanded")
+FunctionRedirects=(OldName="/Script/UBotCore.UBotConventionsLibrary.RotationROSToUE",NewName="/Script/UBotCore.UBotConventionsLibrary.RotationRightHandedToUE")
+FunctionRedirects=(OldName="/Script/UBotCore.UBotConventionsLibrary.TransformUEToROS",NewName="/Script/UBotCore.UBotConventionsLibrary.TransformUEToRightHanded")
+FunctionRedirects=(OldName="/Script/UBotCore.UBotConventionsLibrary.TransformROSToUE",NewName="/Script/UBotCore.UBotConventionsLibrary.TransformRightHandedToUE")
+FunctionRedirects=(OldName="/Script/UBotCore.UBotConventionsLibrary.YawUEToROS",NewName="/Script/UBotCore.UBotConventionsLibrary.YawUEToRightHanded")
+FunctionRedirects=(OldName="/Script/UBotCore.UBotConventionsLibrary.YawROSToUE",NewName="/Script/UBotCore.UBotConventionsLibrary.YawRightHandedToUE")

; K2 resolves the function first, then looks up old pin names under the new function name.
; Class.Function.Pin matches K2's redirect candidates, which have no /Script package prefix.
+PropertyRedirects=(OldName="UBotConventionsLibrary.PositionRightHandedToUE.ROSMeters",NewName="UBotConventionsLibrary.PositionRightHandedToUE.Meters")
+PropertyRedirects=(OldName="UBotConventionsLibrary.AngularVelocityRightHandedToUE.ROSRadiansPerSecond",NewName="UBotConventionsLibrary.AngularVelocityRightHandedToUE.RadiansPerSecond")
+PropertyRedirects=(OldName="UBotConventionsLibrary.RotationRightHandedToUE.ROSRotation",NewName="UBotConventionsLibrary.RotationRightHandedToUE.Rotation")
+PropertyRedirects=(OldName="UBotConventionsLibrary.TransformRightHandedToUE.ROSTransform",NewName="UBotConventionsLibrary.TransformRightHandedToUE.Transform")
+PropertyRedirects=(OldName="UBotConventionsLibrary.YawRightHandedToUE.ROSRadians",NewName="UBotConventionsLibrary.YawRightHandedToUE.Radians")
